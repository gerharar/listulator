[package]
name = "listulator-desktop"
version = "0.1.0"
description = "Listulator standalone desktop app"
authors = ["Listulator contributors"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
# unsafe-headers: MusicBrainz's terms require a real User-Agent, and browsers
# refuse to let JS set that header on `fetch` — the plugin drops forbidden
# headers unless this feature is on. Revisit if Tauri ever exposes a safer,
# narrower way to set just this one header (docs/DECISIONS.md, task 5.7).
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
