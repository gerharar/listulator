[package]
name = "listulator-desktop"
version = "1.0.0-rc.1"
description = "Listulator standalone desktop app"
authors = ["Listulator contributors"]
license = "PolyForm-Noncommercial-1.0.0"
repository = ""
edition = "2021"
# The pinned compiler (rust-toolchain.toml): the number it is built and tested with; a lower one was never tried.
rust-version = "1.98.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = ["isolation"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["isolation"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
# No `unsafe-headers` (SR-006, docs/DECISIONS.md 19.12.4): the plugin's list of forbidden headers does not hold
# `user-agent`, which is the one header the app needs (MusicBrainz's terms). Re-check that after any update of this plugin.
tauri-plugin-http = "2"
tauri-plugin-opener = "~2.5"

# Desktop only: remembers the window's size, position, maximized and full-screen
# state between launches (owner's desktop pass F13, docs/DECISIONS.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
# Updates (task 20.10a, docs/security-review.md section 13): checks and installs a release signed with the owner's offline key.
# Desktop only (the plugin has no mobile build). The minor is held: `requireSignedVersion` exists from 2.13.2, and a new minor is
# read for what it adds to the webview's reach (SR-066) before it is taken. No `tauri-plugin-process`: the app has its own `relaunch`.
# 2.13.3 is 2.13.2 (the version the design read) with `minisign-verify` 0.3, which also rejects a non-canonical signature.
tauri-plugin-updater = "~2.13.3"

