# Builds a Windows TEST app and its update for the updater's two-version test (Phase 20, task 20.13; Phase 31, task 31.6; docs/DECISIONS.md).
# It is not the release.
#
# The app it builds is a separate one: its own name and identifier (so it never touches a real Listulator install or its data), and its
# update address is http://127.0.0.1:8099/latest.json, a file server on the tester's own machine, with the flag that allows plain http.
# That config (apps/desktop/src-tauri/tauri.updater-test.conf.json) is used here and nowhere else.
#
# One run builds BOTH apps: the one to install and the update it is offered. They have to share a key, and the key is made for this run
# and thrown away with it (Phase 31, decision 2, rules S1 to S4): the test app trusts only that key, never the real updater key, and the
# real key signs nothing here. server/src/ciWorkflows.guard.test.ts (the `updaterTest` rules) fails if any of it slips. In short:
# - Started by hand only, read-only, no secret, no token, no variable. Only GitHub's own actions, each pinned by full commit SHA.
# - The key is made once, with --ci, in the runner's temp folder (never the checkout), hidden from the log by its first use, read by nothing
#   else, handed to no other step or job, uploaded nowhere, and deleted in a step that runs whatever happened.
# - The artifact is an exact list of four names: the two installers, the update's signature and the manifest. Logs and artifacts of a public
#   repository are public: nothing but those four can go. Before the upload the signed installer is checked against the run's key (and must
#   FAIL against the real one), and the upload folder is checked for the key's text and for anything key-shaped.
# - The test app can only trust a key it was built with; a release pins the real one, so this key cannot make any real install accept an update.
#
# To use it: Actions -> "Updater test (Windows)" -> Run workflow with the two versions (the second newer), download the artifact, and serve it:
# `npm run updater:serve -- <the unzipped folder>`. Nothing is signed by hand any more.

name: Updater test (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The app to install, e.g. 1.0.0-rc.1"
        type: string
        required: true
      update_version:
        description: "The update that app is offered, e.g. 1.0.0-rc.2 (it must be newer)"
        type: string
        required: true

permissions:
  contents: read

# One group per pair: two different tests build side by side, and only a second run of the SAME pair replaces the first.
concurrency:
  group: updater-test-windows-${{ inputs.version }}-${{ inputs.update_version }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rust (the version in rust-toolchain.toml, on the runner's own rustup)
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($channel -notmatch '^\d+\.\d+\.\d+$') { throw "rust-toolchain.toml does not name an exact version: $channel" }
          rustup toolchain install $channel --profile minimal --no-self-update
          rustup default $channel
          rustc --version
          cargo --version

      # The only place the key is made. The line that hides it in the log comes straight after, and is the only line that reads it.
      - name: A key for this run only (in the runner's temp folder, hidden in the log, deleted at the end)
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'updater-test-run.key'
          npm run tauri -w @listulator/desktop -- signer generate --ci -w $key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "::add-mask::$((Get-Content $key -Raw).Trim())"

      # The committed test config plus this run's PUBLIC key. It refuses the app's real public key.
      - name: The test app trusts this key and no other
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'updater-test-run.key'
          $conf = Join-Path $env:RUNNER_TEMP 'updater-test-run.conf.json'
          npm run updater:test-config -- config --pubkey-file "$key.pub" --out $conf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The versions are set in this checkout only; nothing is committed. `version:set` refuses a text that is not a version, so the input
      # reaches nothing else, and it is handed over through env, never pasted into the script.
      - name: Build the app to install
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $conf = Join-Path $env:RUNNER_TEMP 'updater-test-run.conf.json'
          npm run version:set -w @listulator/server -- $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri:build -w @listulator/desktop -- --bundles nsis --config $conf -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "ListulatorUpdaterTest_$($env:VERSION)_x64-setup.exe"
          $built = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' $name
          if (-not (Test-Path $built)) { throw "No $name was built" }
          New-Item -ItemType Directory -Force -Path updater-test-out | Out-Null
          Copy-Item $built updater-test-out

      - name: Build the update
        shell: pwsh
        env:
          VERSION: ${{ inputs.update_version }}
        run: |
          $conf = Join-Path $env:RUNNER_TEMP 'updater-test-run.conf.json'
          npm run version:set -w @listulator/server -- $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run tauri:build -w @listulator/desktop -- --bundles nsis --config $conf -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "ListulatorUpdaterTest_$($env:VERSION)_x64-setup.exe"
          $built = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' $name
          if (-not (Test-Path $built)) { throw "No $name was built" }
          Copy-Item $built updater-test-out

      # On Windows the installer is the update file. Signed with the key FILE, bound to the update's version, then described in latest.json.
      - name: Sign the update with this run's key
        shell: pwsh
        env:
          UPDATE_VERSION: ${{ inputs.update_version }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'updater-test-run.key'
          $name = "ListulatorUpdaterTest_$($env:UPDATE_VERSION)_x64-setup.exe"
          $installer = (Resolve-Path (Join-Path 'updater-test-out' $name)).Path
          npm run tauri -w @listulator/desktop -- signer sign -f $key --password= --app-version $env:UPDATE_VERSION $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run updater:manifest -- updater-test-out --windows $name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The update verifies against this run's key, fails against the real one, and is newer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_VERSION: ${{ inputs.update_version }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'updater-test-run.key'
          $name = "ListulatorUpdaterTest_$($env:UPDATE_VERSION)_x64-setup.exe"
          $installer = (Resolve-Path (Join-Path 'updater-test-out' $name)).Path
          npm run updater:test-config -- verify --pubkey-file "$key.pub" --installer $installer --version $env:UPDATE_VERSION --installed-version $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Nothing to upload holds the key
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'updater-test-run.key'
          npm run updater:test-config -- staging --dir updater-test-out --key-file $key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listulator-updater-test-windows-${{ inputs.version }}-to-${{ inputs.update_version }}
          path: |
            updater-test-out/ListulatorUpdaterTest_${{ inputs.version }}_x64-setup.exe
            updater-test-out/ListulatorUpdaterTest_${{ inputs.update_version }}_x64-setup.exe
            updater-test-out/ListulatorUpdaterTest_${{ inputs.update_version }}_x64-setup.exe.sig
            updater-test-out/latest.json
          if-no-files-found: error
          retention-days: 3

      # Whatever happened above, the key goes (the runner is thrown away too; this does not rely on that).
      - name: Delete the run's key
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'updater-test-run.key*') -Force -ErrorAction SilentlyContinue
