# Builds the installers for a release, attests them, and drafts the GitHub Release (Phase 20, tasks 20.4 to 20.6, docs/DECISIONS.md).
#
# Runs when a version tag is pushed (v1.0.0, v1.0.0-rc.1) and on nothing else: no branch, no pull request, no button, no
# input. Who may create such a tag is a repository ruleset (only the owner). server/src/ciWorkflows.guard.test.ts holds the
# rest to account and fails if any of it slips:
# - The build jobs (Windows and macOS) have `contents: read`, no secret and no token, and check out the tag without keeping credentials.
# - The only job that may write is `publish`, and only `contents: write`, to create a DRAFT Release. Publishing it, and
#   editing it afterwards, is a person clicking on GitHub; nothing here un-drafts or edits a Release.
# - Only the `attest` job may mint the signing token and write the attestation; it runs no script, and `publish` waits for
#   it and verifies each installer's attestation before drafting anything.
# - A tag is released only if its commit is on `main` and the tag is exactly v + the version in package.json, so a tag on a
#   side branch or a typo cannot produce an installer.
# - Only GitHub's own actions, each pinned by full commit SHA (the version in the comment beside it), on a numbered runner
#   image (a moving `-latest` can change the operating system between two releases).
# - The Windows build job installs the installer it built, starts it and watches it answer, as the step right before the upload, with no
#   condition, folder or environment on it (BL-120).
# - The toolchain is the one named in .node-version and rust-toolchain.toml, and the build runs with --locked (SR-041).
# - The updater's key is never here (20.12a, SR-063). `tauri build` cannot bundle update files without a signing key, so each
#   build job makes a throw-away key for itself in RUNNER_TEMP (not a secret, not the updater key) and uses it for that build only;
#   its signatures are never uploaded. The owner signs the attested files later, offline (`release:sign`, 20.12c).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The whole history, because the next step asks whether the tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag is a release of main, at this version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The commit tagged $env:TAG is not on main" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "The tag is $env:TAG but package.json says version $version" }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rust (the version in rust-toolchain.toml, on the runner's own rustup)
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($channel -notmatch '^\d+\.\d+\.\d+$') { throw "rust-toolchain.toml does not name an exact version: $channel" }
          rustup toolchain install $channel --profile minimal --no-self-update
          rustup default $channel
          rustc --version
          cargo --version

      - name: A throw-away key for the build's own update signatures
        shell: pwsh
        run: |
          npm run tauri -w @listulator/desktop -- signer generate --ci -w "$env:RUNNER_TEMP/updater-throwaway.key"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/updater-throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm run tauri:build -w @listulator/desktop -- --bundles nsis --config src-tauri/tauri.updater-artifacts.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # On Windows the installer is the update file: the build must have made its signature (proof that the update files were
      # built at all), and the upload below takes the .exe only, so the throw-away signature stays on this runner.
      - name: The installer is also the update file
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $installers = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if (-not $installers) { throw 'No installer was built' }
          # The installer's name carries the version the app was built with: it must be the tag's, or the app would offer its own version as an update.
          $expected = "Listulator_$($env:TAG.Substring(1))_x64-setup.exe"
          if (@($installers).Count -ne 1 -or $installers[0].Name -ne $expected) { throw "Expected exactly $expected, found: $($installers.Name -join ', ')" }
          foreach ($installer in $installers) { if (-not (Test-Path "$($installer.FullName).sig")) { throw "No update signature next to $($installer.Name)" } }

      - name: Check the pages register no service worker
        shell: pwsh
        run: |
          $found = Select-String -Path web/dist/index.html, web/dist/assets/*.js -Pattern 'registerSW', 'serviceWorker.register' -SimpleMatch
          if ($found) { $found | Format-Table Path, LineNumber -AutoSize; throw 'The desktop build registers a service worker' }

      - name: List what was built, with its SHA-256
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-Table Hash, Path -AutoSize

      # The installer is tried before it is uploaded (BL-120): installed silently, started, and judged on the version it says, a window that
      # answers and ten seconds of answering, then stopped and uninstalled. A release whose installer does not install, or whose app does not
      # start, stops here, before anything is attested or drafted. It is the file in place, the one uploaded next, so the bytes tried are the bytes
      # that are attested and signed; nothing may sit between this step and the upload. It holds no token and no key, and the installer and the app
      # are given only the system's own variables (releaseCanary.ts, createProgramHost).
      - name: The installer installs, and the app starts and keeps answering
        run: npm run release:install-check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listulator-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3

  build-macos:
    # An Apple-silicon image (macos-15 is arm64; the Intel images carry an -intel suffix). The app is arm64 only (20.1).
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag is a release of main, at this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "The commit tagged $TAG is not on main"; exit 1; fi
          VERSION="$(plutil -extract version raw -o - package.json)"
          if [ "v$VERSION" != "$TAG" ]; then echo "The tag is $TAG but package.json says version $VERSION"; exit 1; fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rust (the version in rust-toolchain.toml, on the runner's own rustup)
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if ! [[ "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "rust-toolchain.toml does not name an exact version: $channel"; exit 1; fi
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
          rustc --version
          cargo --version

      - name: A throw-away key for the build's own update signatures
        run: |
          npm run tauri -w @listulator/desktop -- signer generate --ci -w "$RUNNER_TEMP/updater-throwaway.key"

      - name: Build the app, the disk image and the update archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/updater-throwaway.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ "$(uname -m)" != arm64 ]; then echo "This runner is not Apple silicon"; exit 1; fi
          npm run tauri:build -w @listulator/desktop -- --bundles app,dmg --config src-tauri/tauri.updater-artifacts.conf.json -- --locked

      - name: Check the pages register no service worker
        run: |
          if grep -lE 'registerSW|serviceWorker\.register' web/dist/index.html web/dist/assets/*.js; then echo "The desktop build registers a service worker"; exit 1; fi

      # What the bundle may hold (the 16.4 audit, as a check on every release): the app is arm64 only, sealed (ad-hoc, 20.1),
      # asks for macOS 11.0 or newer, carries the tag's version, and ships only the icon and the three notice files: no .env,
      # database or lists folder. A key could only get in from a file that is not in a clean checkout. The same audit runs on the
      # app inside the update archive (20.12a): after an update, that is the app people run.
      - name: Audit the bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bundle="apps/desktop/src-tauri/target/release/bundle"
          fail() { echo "AUDIT FAILED: $1"; exit 1; }

          audit_app() {
            app="$1"
            plist="$app/Contents/Info.plist"
            [ "$(lipo -archs "$app/Contents/MacOS/listulator-desktop")" = arm64 ] || fail "$2: the executable is not arm64 only"
            codesign --verify --deep --strict --verbose=2 "$app" || fail "$2: the seal is broken"
            [ "$(plutil -extract LSMinimumSystemVersion raw -o - "$plist")" = 11.0 ] || fail "$2: minimum macOS is not 11.0"
            [ "v$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$TAG" ] || fail "$2: the version is not the tag's"
            [ "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = com.listulator.desktop ] || fail "$2: the identifier is not com.listulator.desktop (a test or dev build?)"
            [ "$(ls -A "$app/Contents/Resources" | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE NOTICE.md THIRD-PARTY-NOTICES.txt icon.icns " ] || fail "$2: Resources holds something unexpected"
            [ -z "$(find "$app" \( -name '.env*' -o -name '*.sqlite*' -o -name lists \) -print)" ] || fail "$2: a .env, database or lists folder is inside"
          }

          audit_app "$bundle/macos/Listulator.app" "the app"

          archive="$bundle/macos/Listulator.app.tar.gz"
          [ -f "$archive" ] || fail "the update archive was not built"
          [ -f "$archive.sig" ] || fail "the update archive got no signature (the throw-away one; it is never uploaded)"
          [ "$(tar -tzf "$archive" | cut -d/ -f1 | LC_ALL=C sort -u)" = "Listulator.app" ] || fail "the update archive holds something besides Listulator.app"
          unpacked="$RUNNER_TEMP/unpacked-archive"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          audit_app "$unpacked/Listulator.app" "the app in the update archive"

          for dmg in "$bundle"/dmg/*.dmg; do hdiutil verify "$dmg" || fail "the disk image does not verify"; done
          du -sh "$bundle/macos/Listulator.app"
          shasum -a 256 "$bundle"/dmg/*.dmg "$archive"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listulator-macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 3

      # Its own upload, so the file lands at the top of `dist` like the others. Only the archive: its .sig (the throw-away one) is not uploaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listulator-macos-update
          path: apps/desktop/src-tauri/target/release/bundle/macos/Listulator.app.tar.gz
          if-no-files-found: error
          retention-days: 3

  # Build provenance for every installer (20.6): a signed statement, kept by GitHub, that these exact files were built by this
  # workflow from this commit. This job alone may mint the signing token (`id-token`) and write the attestation, and it runs no
  # script of ours: it downloads the builds and hands them to GitHub's action. It does not touch the repository or the Release.
  attest:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: listulator-*
          merge-multiple: true
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz

  publish:
    needs: [build-windows, build-macos, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: listulator-*
          merge-multiple: true
          path: dist

      # No checkout: the job only handles the built files and talks to GitHub, so GH_REPO names the repository for the CLI.
      # The token is handed to the CLI here and nowhere else (ciWorkflows.guard.test.ts), and the Release is a DRAFT.
      - name: Draft the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # No signature travels: the build jobs' own are throw-away, and the owner's real ones are added by hand later (20.12c).
          if compgen -G '*.sig' > /dev/null; then echo "A signature file is in the build output"; exit 1; fi
          # The files drafted are the files attested: each must verify against this repository's attestation, or nothing is drafted.
          # A new attestation can take a few seconds to be readable, so a miss is retried.
          for file in *.exe *.dmg *.tar.gz; do
            verified=no
            for attempt in 1 2 3 4 5 6; do
              if gh attestation verify "$file" --repo "$GH_REPO"; then verified=yes; break; fi
              sleep 10
            done
            if [ "$verified" != yes ]; then echo "No valid attestation for $file"; exit 1; fi
          done
          sha256sum -- *.exe *.dmg *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          args=()
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag "${args[@]}" \
            --title "Listulator $TAG" \
            --notes "Draft made by the release workflow from the tag. Write the notes, check the files, then publish." \
            -- *.exe *.dmg *.tar.gz SHA256SUMS
